name: Android APK Derle
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur ve web'i derle
        run: |
          npm install
          npm run build

      - name: Android platformunu hazırla
        run: |
          [ -d android ] || npx cap add android
          [ ! -d assets ] || npx capacitor-assets generate --android
          npx cap sync android

      - name: Surum ve izinleri uygula
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode 1/; s/versionName "[^"]*"/versionName "1.0.0"/' android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation' $M || sed -i -E '0,/<activity /s#<activity #<activity android:screenOrientation="portrait" #' $M

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: APK'yı Release olarak yayınla (QR / indirme bağlantısı)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          gh release create "$TAG" app-debug.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "APK $TAG" --notes "CodeStudio ile derlendi" || gh release upload "$TAG" app-debug.apk --repo "${{ github.repository }}" --clobber